<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" />
    <script>
      // Anti-flash : applique le thème (light/dark/auto) avant le premier
      // paint. Doit rester synchrone et identique à la logique de
      // src/hooks/useTheme.tsx (même clé de stockage).
      (function () {
        try {
          var stored = localStorage.getItem("domestique-theme");
          var dark =
            stored === "dark" ||
            ((stored === "system" || !stored) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0c0d10" : "#f4f6f9");
        } catch (e) {
          /* localStorage indisponible : on laisse le thème clair par défaut. */
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="description"
      content="DomestiqueAI — suivi d'entraînement cycliste et coach IA : charge, récupération, plan personnalisé."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DomestiqueAI" />
    <meta property="og:title" content="DomestiqueAI" />
    <meta
      property="og:description"
      content="Suivi d'entraînement cycliste et coach IA : charge, récupération, plan personnalisé."
    />
    <meta property="og:url" content="https://domestique-ai.com/" />
    <meta property="og:locale" content="fr_FR" />
    <link rel="canonical" href="https://domestique-ai.com/" />
    <title>DomestiqueAI</title>
  </head>
  <body class="bg-surface text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
