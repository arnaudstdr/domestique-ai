<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17191f"/>
      <stop offset="0.42" stop-color="#0c0d10"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="104" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7f24a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c7f24a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tuile near-black + halo lime, dans le meme esprit que les cartes de l'app. -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Monogramme « D » : trace geometrique massif, lime. Contour plein + contre-forme
       evidee via fill-rule evenodd (le halo transparait dans le creux du D). -->
  <path fill="#c7f24a" fill-rule="evenodd" d="
    M150 138 L150 374 L256 374
    C340 374 388 318 388 256
    C388 194 340 138 256 138 Z
    M228 206 L228 306 L256 306
    C298 306 320 284 320 256
    C320 228 298 206 256 206 Z
  "/>
</svg>
