name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - ".claude/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - ".claude/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Format + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  security:
    name: Security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0

    steps:
      - uses: actions/checkout@v5

      - name: Security (semgrep)
        run: semgrep scan --config .semgrep.yml --error --strict
